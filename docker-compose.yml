services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_BIND:-0.0.0.0}:1883:1883"
    volumes:
      # Absolute host path via env var. When the upgrader sidecar runs
      # `docker compose up -d` from its bind-mount at /work, compose
      # would otherwise resolve `./mosquitto/config` to /work/...,
      # which doesn't exist on the host — and compose then sees a mount
      # mismatch and *recreates* mosquitto with the broken bind. The
      # :-. fallback keeps host-side `docker compose` working when run
      # from /opt/pitstop directly.
      - ${PITSTOP_HOST_DIR:-.}/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -W 2 -C 1 -u $$MQTT_USER -P $$MQTT_PASSWORD || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}

  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER:-pr0zak}/pitstop-backend:${BACKEND_TAG:-latest}
    build:
      context: ./backend
      # When `docker compose build` runs locally on the CT (instead of
      # pulling the CI-tagged image), these args inject the right
      # version/sha so /version doesn't report "dev". CI sets them on
      # the GHCR build directly.
      args:
        VERSION: ${BACKEND_TAG:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      INGEST_TOKEN: ${INGEST_TOKEN}
      QUERY_TOKEN: ${QUERY_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
      PID_PROFILES_DIR: /app/pid_profiles
      PITSTOP_DISK_ALERT_WEBHOOK: ${PITSTOP_DISK_ALERT_WEBHOOK:-}
      # /admin/upgrade spawns a docker:27-cli sidecar that bind-mounts
      # the CT's pitstop dir at /work — this env tells the backend
      # which host path to pass through.
      PITSTOP_HOST_DIR: ${PITSTOP_HOST_DIR:-/opt/pitstop}
    volumes:
      - ${PITSTOP_HOST_DIR:-.}/pid_profiles:/app/pid_profiles:ro
      - photos_data:/app/data/photos
      # In-app upgrade flow — backend shells out to `docker run` on the
      # host daemon. Single-tenant CT, LAN-only; socket-as-root tradeoff
      # is the same one Zonik's /api/upgrade makes.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/${GHCR_OWNER:-pr0zak}/pitstop-frontend:${FRONTEND_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
  photos_data:
