[project]
name = "pitstop"
version = "0.1.0"
description = "Self-hosted vehicle telemetry & fuel tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiomqtt>=2.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dateutil>=2.9",
    "structlog>=24.4",
    "httpx>=0.28",
    # XLS parser for the EIA weekly retail-gasoline workbook
    # (https://www.eia.gov/dnav/pet/xls/PET_PRI_GND_DCUS_NUS_W.xls).
    # The file is BIFF8 .xls (Excel 97-2003), not modern XLSX, so
    # openpyxl can't read it — xlrd 1.2 is the only maintained option
    # for BIFF. Pinned to 1.2.x because xlrd 2.0+ dropped XLS support.
    "xlrd>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitstop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's standard pattern uses Depends(...)/Query(...) in defaults; B008
# would force a wrapper for every dependency. N803/N806 occur where we
# accept ``from`` as a query alias (Python keyword) so we use ``from_``.
"src/pitstop/api/*.py" = ["B008", "N803"]
# Tests use whatever capitalisation makes the assertion clearest.
"tests/*.py" = ["B008", "N802", "N803"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
